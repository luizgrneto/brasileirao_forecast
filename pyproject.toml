[project]
name = "brasileirao_forecast"
version = "0.1.0"
description = "Probabilistic match forecasts for the Brazilian Série A, with Vasco da Gama as the focus team."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Luiz Gomes Ribeiro Neto" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "httpx>=0.27",
]

# Dependency groups (PEP 735, handled by uv). `uv sync` installs `dev` by default;
# the others are added per phase, e.g. `uv sync --group models`.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "nbstripout>=0.7"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8"]
models = ["scipy>=1.11", "scikit-learn>=1.4", "statsmodels>=0.14"]
tracking = ["mlflow>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brasileirao_forecast"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
